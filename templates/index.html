<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />

  <title>RickyGPT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <style>
    :root {
      --bg: #0d0f13;
      --sidebar: #111318;
      --panel: #171a22;
      --panel-2: #1d212b;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.13);

      --text: #f5f7fb;
      --text-soft: #d7dce7;
      --muted: #8e96a7;

      --accent: #8b8cff;
      --accent-2: #68d5ff;

      --success: #6fd4a4;
      --danger: #ff8585;

      --max-chat: 880px;
      --sidebar-width: 286px;

      --shadow:
        0 18px 60px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at 75% -10%,
          rgba(90, 97, 255, 0.11),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    textarea,
    select,
    input {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid rgba(139, 140, 255, 0.75);
      outline-offset: 2px;
    }

    ::selection {
      background: rgba(139, 140, 255, 0.35);
    }

    .app-shell {
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);

      height: 100%;

      background:
        linear-gradient(
          180deg,
          var(--sidebar),
          #0f1116
        );

      border-right: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      padding: 14px 12px 12px;

      transition:
        width 0.22s ease,
        min-width 0.22s ease,
        transform 0.22s ease,
        opacity 0.22s ease;

      z-index: 30;
    }

    .sidebar.collapsed {
      width: 0;
      min-width: 0;

      padding-left: 0;
      padding-right: 0;

      opacity: 0;

      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 11px;

      padding: 8px 8px 16px;
    }

    .brand-logo {
      width: 35px;
      height: 35px;

      border-radius: 11px;

      background:
        linear-gradient(
          145deg,
          rgba(139, 140, 255, 0.96),
          rgba(104, 213, 255, 0.95)
        );

      display: grid;
      place-items: center;

      color: #071017;

      font-family: Manrope, sans-serif;
      font-weight: 800;

      box-shadow:
        0 8px 30px rgba(104, 135, 255, 0.23);
    }

    .brand-copy {
      min-width: 0;
      line-height: 1.05;
    }

    .brand-name {
      font-family: Manrope, sans-serif;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: -0.01em;
    }

    .brand-sub {
      margin-top: 4px;

      font-size: 11px;

      color: var(--muted);
    }

    .sidebar-controls {
      display: grid;

      grid-template-columns: 1fr 40px;

      gap: 8px;

      padding: 0 2px 12px;
    }

    .new-chat-btn,
    .sidebar-icon-btn {
      height: 42px;

      border-radius: 12px;

      border: 1px solid var(--border);

      background:
        rgba(255, 255, 255, 0.025);

      transition: 0.18s ease;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;

      gap: 9px;

      padding: 0 12px;

      font-weight: 600;

      color: var(--text-soft);
    }

    .new-chat-btn:hover,
    .sidebar-icon-btn:hover,
    .conversation:hover {
      background:
        rgba(255, 255, 255, 0.055);

      border-color:
        var(--border-strong);
    }

    .sidebar-icon-btn {
      display: grid;
      place-items: center;

      color: var(--muted);

      font-size: 17px;
    }

    .sidebar-section-title {
      padding: 10px 10px 7px;

      color: #727b8f;

      font-size: 10px;
      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.12em;
    }

    .conversation-list {
      flex: 1;

      overflow-y: auto;

      padding: 0 2px;

      scrollbar-width: thin;

      scrollbar-color:
        rgba(255, 255, 255, 0.08)
        transparent;
    }

    .conversation {
      width: 100%;

      min-height: 42px;

      display: flex;
      align-items: center;

      gap: 10px;

      padding: 8px 10px;

      margin-bottom: 3px;

      border-radius: 10px;

      border: 1px solid transparent;

      background: transparent;

      color: #c8ceda;

      text-align: left;

      transition: 0.15s ease;
    }

    .conversation.active {
      background:
        linear-gradient(
          90deg,
          rgba(139, 140, 255, 0.12),
          rgba(104, 213, 255, 0.04)
        );

      border-color:
        rgba(139, 140, 255, 0.14);

      color: #f2f5fb;
    }

    .conversation-dot {
      width: 7px;
      height: 7px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: #4e5564;
    }

    .conversation.active .conversation-dot {
      background: var(--accent);

      box-shadow:
        0 0 0 4px rgba(139, 140, 255, 0.10);
    }

    .conversation-title {
      min-width: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 13px;
    }

    .sidebar-footer {
      margin-top: 10px;

      border-top: 1px solid var(--border);

      padding: 13px 8px 4px;

      display: flex;
      align-items: center;

      gap: 10px;

      color: var(--muted);

      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 0 4px rgba(111, 212, 164, 0.08);
    }

    /* =========================================================
       MAIN
    ========================================================= */

    .main {
      flex: 1;

      min-width: 0;

      display: flex;
      flex-direction: column;

      position: relative;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(139, 140, 255, 0.035),
          transparent 24%
        );
    }

    .topbar {
      height: 64px;
      min-height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      border-bottom:
        1px solid rgba(255, 255, 255, 0.045);

      background:
        rgba(13, 15, 19, 0.72);

      backdrop-filter: blur(18px);

      position: relative;

      z-index: 12;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    .menu-btn,
    .topbar-action {
      width: 39px;
      height: 39px;

      border-radius: 11px;

      background: transparent;

      color: var(--muted);

      display: grid;
      place-items: center;

      transition: 0.16s ease;
    }

    .menu-btn:hover,
    .topbar-action:hover {
      background:
        rgba(255, 255, 255, 0.05);

      color: var(--text);
    }

    .model-wrap {
      position: relative;

      display: flex;
      align-items: center;

      gap: 7px;
    }

    .model-select {
      appearance: none;

      border: 1px solid transparent;

      background: transparent;

      color: var(--text-soft);

      padding:
        8px 30px 8px 10px;

      border-radius: 10px;

      outline: 0;

      font-weight: 600;
      font-size: 13px;

      cursor: pointer;
    }

    .model-select:hover {
      background:
        rgba(255, 255, 255, 0.045);
    }

    .model-wrap::after {
      content: "⌄";

      position: absolute;

      right: 10px;
      top: 8px;

      color: var(--muted);

      pointer-events: none;

      font-size: 14px;
    }

    .model-select option {
      background: #191d25;

      color: var(--text);
    }

    .chat-scroll {
      flex: 1;

      overflow-y: auto;

      scroll-behavior: smooth;

      scrollbar-width: thin;

      scrollbar-color:
        rgba(255, 255, 255, 0.08)
        transparent;
    }

    /* =========================================================
       EMPTY STATE
    ========================================================= */

    .empty-state {
      min-height:
        calc(100vh - 190px);

      display: flex;

      justify-content: center;
      align-items: center;

      padding:
        40px 22px 140px;
    }

    .welcome {
      width:
        min(760px, 100%);

      text-align: center;
    }

    .hero-logo {
      width: 58px;
      height: 58px;

      margin:
        0 auto 20px;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(139, 140, 255, 1),
          rgba(104, 213, 255, 1)
        );

      display: grid;
      place-items: center;

      color: #071017;

      font-family: Manrope, sans-serif;

      font-size: 24px;
      font-weight: 800;

      box-shadow:
        0 18px 60px rgba(94, 115, 255, 0.25);
    }

    .welcome h1 {
      font-family: Manrope, sans-serif;

      font-size:
        clamp(28px, 4vw, 40px);

      letter-spacing: -0.035em;

      margin: 0;

      line-height: 1.1;
    }

    .welcome p {
      max-width: 590px;

      margin:
        12px auto 0;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.7;
    }

    .prompt-grid {
      max-width: 660px;

      margin:
        28px auto 0;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;

      text-align: left;
    }

    .prompt-card {
      min-height: 94px;

      padding: 15px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.035),
          rgba(255, 255, 255, 0.018)
        );

      border: 1px solid var(--border);

      border-radius: 15px;

      transition: 0.18s ease;

      cursor: pointer;
    }

    .prompt-card:hover {
      transform:
        translateY(-2px);

      background:
        rgba(255, 255, 255, 0.05);

      border-color:
        rgba(139, 140, 255, 0.25);
    }

    .prompt-card-title {
      margin-bottom: 7px;

      color: var(--text-soft);

      font-weight: 600;

      font-size: 13px;
    }

    .prompt-card-text {
      color: var(--muted);

      font-size: 12px;

      line-height: 1.5;
    }

    /* =========================================================
       MESSAGES
    ========================================================= */

    .messages {
      padding:
        28px 0 190px;
    }

    .message-row {
      width: 100%;

      padding:
        11px 24px;
    }

    .message-inner {
      width:
        min(var(--max-chat), 100%);

      margin:
        0 auto;
    }

    .message-row.user .message-inner {
      display: flex;

      justify-content: flex-end;
    }

    .user-bubble {
      max-width:
        min(76%, 670px);

      padding:
        12px 16px;

      background:
        linear-gradient(
          145deg,
          #252b36,
          #20252f
        );

      border:
        1px solid rgba(255, 255, 255, 0.07);

      border-radius:
        18px 18px 5px 18px;

      color: #f1f4f8;

      font-size: 14px;

      line-height: 1.58;

      white-space: pre-wrap;

      overflow-wrap: anywhere;

      box-shadow:
        0 6px 22px rgba(0, 0, 0, 0.12);
    }

    .assistant-wrap {
      display: grid;

      grid-template-columns:
        31px minmax(0, 1fr);

      gap: 12px;

      align-items: start;
    }

    .assistant-avatar {
      width: 31px;
      height: 31px;

      border-radius: 9px;

      display: grid;
      place-items: center;

      flex: 0 0 auto;

      background:
        linear-gradient(
          145deg,
          rgba(139, 140, 255, 0.95),
          rgba(104, 213, 255, 0.95)
        );

      color: #081017;

      font-size: 11px;
      font-weight: 800;

      margin-top: 1px;
    }

    .assistant-content {
      min-width: 0;

      color: #dfe4ed;

      line-height: 1.72;

      font-size: 14px;

      overflow-wrap: anywhere;
    }

    .assistant-content p:first-child {
      margin-top: 2px;
    }

    .assistant-content p:last-child {
      margin-bottom: 0;
    }

    .assistant-content h1,
    .assistant-content h2,
    .assistant-content h3 {
      color: #f4f6fa;

      line-height: 1.3;
    }

    .assistant-content a {
      color: #9ecfff;
    }

    .assistant-content pre {
      position: relative;

      margin: 14px 0;

      background: #0a0c10;

      border:
        1px solid var(--border-strong);

      border-radius: 13px;

      padding:
        18px 16px 16px;

      overflow-x: auto;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .assistant-content code {
      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 12.5px;
    }

    .assistant-content :not(pre) > code {
      padding:
        2px 6px;

      background: #232936;

      border:
        1px solid rgba(255, 255, 255, 0.05);

      border-radius: 6px;

      color: #e9ecf5;
    }

    .assistant-content blockquote {
      margin-left: 0;

      padding-left: 14px;

      border-left:
        3px solid rgba(139, 140, 255, 0.5);

      color: #aeb6c5;
    }

    .copy-code {
      position: absolute;

      top: 9px;
      right: 9px;

      padding:
        5px 8px;

      border-radius: 7px;

      background:
        rgba(255, 255, 255, 0.07);

      color: #b7bfce;

      font-size: 10px;

      border:
        1px solid rgba(255, 255, 255, 0.06);
    }

    .thinking {
      display: inline-flex;

      align-items: center;

      gap: 5px;

      min-height: 28px;

      color: var(--muted);
    }

    .thinking-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #8c94a5;

      animation:
        pulse 1.1s infinite ease-in-out;
    }

    .thinking-dot:nth-child(2) {
      animation-delay: 0.12s;
    }

    .thinking-dot:nth-child(3) {
      animation-delay: 0.24s;
    }

    @keyframes pulse {
      0%,
      80%,
      100% {
        opacity: 0.28;
        transform: scale(0.76);
      }

      40% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =========================================================
       COMPOSER
    ========================================================= */

    .composer-zone {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      padding:
        34px 18px 13px;

      background:
        linear-gradient(
          to top,
          var(--bg) 68%,
          rgba(13, 15, 19, 0.92) 83%,
          rgba(13, 15, 19, 0)
        );

      z-index: 10;
    }

    .composer {
      width:
        min(var(--max-chat), 100%);

      margin:
        0 auto;

      border-radius: 22px;

      border:
        1px solid var(--border-strong);

      background:
        rgba(29, 33, 43, 0.93);

      backdrop-filter: blur(20px);

      box-shadow: var(--shadow);

      padding:
        9px 10px 8px 12px;

      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .composer:focus-within {
      border-color:
        rgba(139, 140, 255, 0.28);

      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.34),
        0 0 0 3px rgba(139, 140, 255, 0.045);
    }

    .file-chip {
      display: none;

      align-items: center;

      gap: 9px;

      width: fit-content;

      max-width:
        calc(100% - 10px);

      margin:
        2px 4px 8px;

      padding:
        8px 10px;

      background:
        rgba(255, 255, 255, 0.05);

      border:
        1px solid var(--border);

      border-radius: 10px;

      color: #c8cfdb;

      font-size: 11px;
    }

    .file-chip-icon {
      width: 25px;
      height: 25px;

      border-radius: 7px;

      display: grid;
      place-items: center;

      background:
        rgba(139, 140, 255, 0.13);

      color: #b8b9ff;
    }

    textarea {
      width: 100%;

      resize: none;

      min-height: 42px;
      max-height: 190px;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text);

      padding:
        9px 9px 6px;

      line-height: 1.48;

      font-size: 14px;
    }

    textarea::placeholder {
      color: #7d8697;
    }

    .composer-footer {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding:
        0 1px;
    }

    .composer-left,
    .composer-right {
      display: flex;

      align-items: center;

      gap: 6px;
    }

    .composer-btn {
      min-width: 34px;
      height: 34px;

      border-radius: 10px;

      padding:
        0 10px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      background: transparent;

      color: #a9b1c1;

      transition: 0.16s ease;
    }

    .composer-btn:hover {
      background:
        rgba(255, 255, 255, 0.06);

      color: #f4f6fb;
    }

    .attach-label {
      display: none;

      font-size: 11px;

      font-weight: 600;
    }

    .send-btn {
      width: 35px;
      min-width: 35px;

      padding: 0;

      border-radius: 11px;

      background:
        linear-gradient(
          145deg,
          #f4f5ff,
          #cddcff
        );

      color: #11151d;

      font-weight: 800;

      box-shadow:
        0 8px 22px rgba(117, 140, 255, 0.18);
    }

    .send-btn:hover {
      transform:
        translateY(-1px);
    }

    .send-btn:disabled {
      opacity: 0.36;

      cursor: default;

      transform: none;
    }

    .stop-btn {
      width: 35px;
      min-width: 35px;

      padding: 0;

      background: #f0f1f5;

      color: #171a20;
    }

    .status-line {
      width:
        min(var(--max-chat), 100%);

      margin:
        7px auto 0;

      padding:
        0 9px;

      min-height: 18px;

      color: var(--muted);

      font-size: 11px;
    }

    .composer-note {
      width:
        min(var(--max-chat), 100%);

      margin:
        1px auto 0;

      color: #60697b;

      font-size: 10px;

      text-align: center;
    }

    /* =========================================================
       ERROR TOAST
    ========================================================= */

    .toast {
      position: fixed;

      top: 18px;
      right: 18px;

      z-index: 100;

      width:
        min(420px, calc(100vw - 36px));

      padding:
        12px 14px;

      border-radius: 12px;

      border:
        1px solid rgba(255, 133, 133, 0.24);

      background:
        rgba(67, 28, 33, 0.96);

      color: #ffd9dc;

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.32);

      font-size: 12px;

      line-height: 1.45;

      display: none;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (min-width: 860px) {
      .attach-label {
        display: inline;
      }
    }

    @media (max-width: 780px) {
      .sidebar {
        position: fixed;

        inset:
          0 auto 0 0;

        transform:
          translateX(-100%);

        opacity: 1;

        width:
          min(86vw, 300px);

        min-width:
          min(86vw, 300px);

        box-shadow:
          28px 0 70px rgba(0, 0, 0, 0.45);
      }

      .sidebar.mobile-open {
        transform:
          translateX(0);
      }

      .sidebar.collapsed {
        width:
          min(86vw, 300px);

        min-width:
          min(86vw, 300px);

        opacity: 1;
      }

      .topbar {
        padding-left: 12px;
        padding-right: 12px;
      }

      .message-row {
        padding-left: 14px;
        padding-right: 14px;
      }

      .user-bubble {
        max-width: 88%;
      }

      .prompt-grid {
        grid-template-columns: 1fr;
      }

      .empty-state {
        align-items: flex-start;

        padding-top: 60px;
      }

      .welcome p {
        padding:
          0 12px;
      }

      .composer-zone {
        padding-left: 10px;
        padding-right: 10px;
      }
    }

    @media (max-width: 520px) {
      .brand-sub {
        display: none;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .prompt-card:nth-child(n + 3) {
        display: none;
      }

      .model-select {
        max-width: 205px;
      }

      .assistant-wrap {
        grid-template-columns:
          27px minmax(0, 1fr);

        gap: 10px;
      }

      .assistant-avatar {
        width: 27px;
        height: 27px;

        border-radius: 8px;

        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<div
  class="toast"
  id="errorToast"
></div>

<div class="app-shell">

  <!-- =======================================================
       SIDEBAR
  ======================================================== -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="brand">

      <div class="brand-logo">
        R
      </div>

      <div class="brand-copy">

        <div class="brand-name">
          RickyGPT
        </div>

        <div class="brand-sub">
          Agentic AI Assistant
        </div>

      </div>

    </div>


    <div class="sidebar-controls">

      <button
        class="new-chat-btn"
        id="newChatBtn"
      >

        <span>＋</span>

        <span>
          New chat
        </span>

      </button>


      <button
        class="sidebar-icon-btn"
        id="closeSidebarBtn"
        title="Collapse sidebar"
      >
        ‹
      </button>

    </div>


    <div class="sidebar-section-title">
      Recent conversations
    </div>


    <div
      class="conversation-list"
      id="conversationList"
    ></div>


    <div class="sidebar-footer">

      <span class="status-dot"></span>

      <span>
        API connected
      </span>

    </div>

  </aside>


  <!-- =======================================================
       MAIN
  ======================================================== -->

  <main class="main">

    <header class="topbar">

      <div class="topbar-left">

        <button
          class="menu-btn"
          id="menuBtn"
          title="Toggle sidebar"
        >
          ☰
        </button>


        <div class="model-wrap">

          <select
            class="model-select"
            id="modelSelect"
            aria-label="Select model"
          >

            <option
              value="gemini-3-flash-preview"
            >
              Gemini 3 Flash Preview
            </option>

          </select>

        </div>

      </div>


      <div class="topbar-right">

        <button
          class="topbar-action"
          title="New chat"
          id="topNewChatBtn"
        >
          ＋
        </button>

      </div>

    </header>


    <!-- =====================================================
         CHAT AREA
    ====================================================== -->

    <section
      class="chat-scroll"
      id="chatScroll"
    >

      <div
        class="empty-state"
        id="emptyState"
      >

        <div class="welcome">

          <div class="hero-logo">
            R
          </div>

          <h1>
            What can I help you with?
          </h1>

          <p>
            Ask questions, analyze uploaded documents,
            or let RickyGPT use its tools to research
            and reason through a task.
          </p>


          <div class="prompt-grid">

            <button
              class="prompt-card"
              data-prompt="Explain a difficult technical concept in simple terms."
            >

              <div class="prompt-card-title">
                Explain something
              </div>

              <div class="prompt-card-text">
                Break down a complex technical topic
                into a clear explanation.
              </div>

            </button>


            <button
              class="prompt-card"
              data-prompt="Help me review and improve this code."
            >

              <div class="prompt-card-title">
                Review code
              </div>

              <div class="prompt-card-text">
                Analyze implementation choices
                and suggest practical improvements.
              </div>

            </button>


            <button
              class="prompt-card"
              data-prompt="Research a topic and summarize the important findings."
            >

              <div class="prompt-card-title">
                Research a topic
              </div>

              <div class="prompt-card-text">
                Use the agent's tools to gather
                and summarize useful information.
              </div>

            </button>


            <button
              class="prompt-card"
              data-prompt="Help me analyze a document I upload."
            >

              <div class="prompt-card-title">
                Analyze a document
              </div>

              <div class="prompt-card-text">
                Upload PDF, DOCX, TXT, Markdown,
                Python, or CSV files.
              </div>

            </button>

          </div>

        </div>

      </div>


      <div
        class="messages"
        id="messages"
        hidden
      ></div>

    </section>


    <!-- =====================================================
         COMPOSER
    ====================================================== -->

    <div class="composer-zone">

      <div class="composer">

        <div
          class="file-chip"
          id="fileChip"
        >

          <span class="file-chip-icon">
            ↥
          </span>

          <span id="fileChipText"></span>

        </div>


        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message RickyGPT..."
          autocomplete="off"
        ></textarea>


        <div class="composer-footer">

          <div class="composer-left">

            <input
              id="fileInput"
              type="file"
              hidden
              accept=".pdf,.docx,.txt,.md,.py,.csv"
            />


            <button
              class="composer-btn"
              id="attachBtn"
              title="Upload document"
            >

              <span>
                ＋
              </span>

              <span class="attach-label">
                Attach
              </span>

            </button>

          </div>


          <div class="composer-right">

            <button
              class="composer-btn stop-btn"
              id="stopBtn"
              title="Stop response"
              hidden
            >
              ■
            </button>


            <button
              class="composer-btn send-btn"
              id="sendBtn"
              title="Send message"
            >
              ↑
            </button>

          </div>

        </div>

      </div>


      <div
        class="status-line"
        id="statusLine"
      ></div>


      <div class="composer-note">
        AI can make mistakes. Verify important information.
      </div>

    </div>

  </main>

</div>


<script>

  /* =========================================================
     MARKDOWN CONFIGURATION
  ========================================================= */

  marked.setOptions({
    breaks: true,
    gfm: true
  });


  /* =========================================================
     DOM HELPERS
  ========================================================= */

  const el = (id) => {
    return document.getElementById(id);
  };


  const ui = {

    sidebar:
      el("sidebar"),

    menuBtn:
      el("menuBtn"),

    closeSidebarBtn:
      el("closeSidebarBtn"),

    newChatBtn:
      el("newChatBtn"),

    topNewChatBtn:
      el("topNewChatBtn"),

    conversationList:
      el("conversationList"),

    chatScroll:
      el("chatScroll"),

    emptyState:
      el("emptyState"),

    messages:
      el("messages"),

    messageInput:
      el("messageInput"),

    sendBtn:
      el("sendBtn"),

    stopBtn:
      el("stopBtn"),

    attachBtn:
      el("attachBtn"),

    fileInput:
      el("fileInput"),

    fileChip:
      el("fileChip"),

    fileChipText:
      el("fileChipText"),

    statusLine:
      el("statusLine"),

    modelSelect:
      el("modelSelect"),

    errorToast:
      el("errorToast")

  };


  /* =========================================================
     THREAD ID GENERATOR

     IMPORTANT:
     crypto.randomUUID() does not work in all browsers
     over plain HTTP.

     This function uses randomUUID when available,
     otherwise it creates a fallback ID.
  ========================================================= */

  function generateThreadId() {

    if (
      window.crypto &&
      typeof window.crypto.randomUUID === "function"
    ) {

      return window.crypto.randomUUID();

    }


    const timestamp =
      Date.now().toString(36);


    const randomPart =
      Math.random()
        .toString(36)
        .substring(2, 12);


    return `${timestamp}-${randomPart}`;

  }


  /* =========================================================
     APPLICATION STATE
  ========================================================= */

  let currentThreadId =
    localStorage.getItem("currentThreadId")
    || generateThreadId();


  let activeController = null;

  let isStreaming = false;


  function setThreadId(threadId) {

    currentThreadId =
      threadId;


    localStorage.setItem(
      "currentThreadId",
      threadId
    );

  }


  /* =========================================================
     ERROR TOAST
  ========================================================= */

  function showToast(message) {

    ui.errorToast.textContent =
      message;


    ui.errorToast.style.display =
      "block";


    clearTimeout(
      showToast.timer
    );


    showToast.timer =
      setTimeout(
        () => {

          ui.errorToast.style.display =
            "none";

        },
        6000
      );

  }


  /* =========================================================
     CHAT UI HELPERS
  ========================================================= */

  function showEmptyState(show) {

    ui.emptyState.hidden =
      !show;


    ui.messages.hidden =
      show;

  }


  function scrollToBottom() {

    requestAnimationFrame(
      () => {

        ui.chatScroll.scrollTop =
          ui.chatScroll.scrollHeight;

      }
    );

  }


  function renderMarkdown(markdown) {

    const html =
      marked.parse(
        markdown || ""
      );


    return DOMPurify.sanitize(
      html
    );

  }


  /* =========================================================
     CLIPBOARD FALLBACK

     navigator.clipboard may not work over plain HTTP.
  ========================================================= */

  async function copyText(text) {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator.clipboard.writeText(
        text
      );

      return true;

    }


    const textArea =
      document.createElement(
        "textarea"
      );


    textArea.value =
      text;


    textArea.style.position =
      "fixed";


    textArea.style.left =
      "-999999px";


    textArea.style.top =
      "-999999px";


    document.body.appendChild(
      textArea
    );


    textArea.focus();

    textArea.select();


    let copied = false;


    try {

      copied =
        document.execCommand(
          "copy"
        );

    }
    catch (error) {

      copied =
        false;

    }


    textArea.remove();


    return copied;

  }


  function addCopyButtons(container) {

    container
      .querySelectorAll("pre")
      .forEach(
        (pre) => {

          if (
            pre.querySelector(
              ".copy-code"
            )
          ) {

            return;

          }


          const button =
            document.createElement(
              "button"
            );


          button.className =
            "copy-code";


          button.textContent =
            "Copy";


          button.addEventListener(
            "click",
            async () => {

              const code =
                pre.querySelector(
                  "code"
                )?.innerText
                || pre.innerText;


              try {

                const copied =
                  await copyText(
                    code
                  );


                button.textContent =
                  copied
                    ? "Copied"
                    : "Copy failed";

              }
              catch (error) {

                button.textContent =
                  "Copy failed";

              }


              setTimeout(
                () => {

                  button.textContent =
                    "Copy";

                },
                1200
              );

            }
          );


          pre.appendChild(
            button
          );

        }
      );

  }


  /* =========================================================
     MESSAGE CREATION
  ========================================================= */

  function buildAssistantBody(
    content = ""
  ) {

    const wrap =
      document.createElement(
        "div"
      );


    wrap.className =
      "assistant-wrap";


    const avatar =
      document.createElement(
        "div"
      );


    avatar.className =
      "assistant-avatar";


    avatar.textContent =
      "R";


    const body =
      document.createElement(
        "div"
      );


    body.className =
      "assistant-content";


    body.innerHTML =
      renderMarkdown(
        content
      );


    addCopyButtons(
      body
    );


    wrap.appendChild(
      avatar
    );


    wrap.appendChild(
      body
    );


    return {
      wrap,
      body
    };

  }


  function createMessage(
    role,
    content = ""
  ) {

    showEmptyState(
      false
    );


    const row =
      document.createElement(
        "div"
      );


    row.className =
      `message-row ${role}`;


    const inner =
      document.createElement(
        "div"
      );


    inner.className =
      "message-inner";


    if (
      role === "user"
    ) {

      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "user-bubble";


      bubble.textContent =
        content;


      inner.appendChild(
        bubble
      );

    }
    else {

      const assistant =
        buildAssistantBody(
          content
        );


      inner.appendChild(
        assistant.wrap
      );

    }


    row.appendChild(
      inner
    );


    ui.messages.appendChild(
      row
    );


    scrollToBottom();


    return row;

  }


  function createStreamingAssistant() {

    showEmptyState(
      false
    );


    const row =
      document.createElement(
        "div"
      );


    row.className =
      "message-row assistant";


    const inner =
      document.createElement(
        "div"
      );


    inner.className =
      "message-inner";


    const assistant =
      buildAssistantBody();


    assistant.body.innerHTML = `
      <span
        class="thinking"
        aria-label="Thinking"
      >
        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>
      </span>
    `;


    inner.appendChild(
      assistant.wrap
    );


    row.appendChild(
      inner
    );


    ui.messages.appendChild(
      row
    );


    scrollToBottom();


    return assistant.body;

  }


  function updateAssistant(
    body,
    content
  ) {

    body.innerHTML =
      renderMarkdown(
        content
      );


    addCopyButtons(
      body
    );


    scrollToBottom();

  }


  /* =========================================================
     STREAMING STATE
  ========================================================= */

  function setStreamingState(
    streaming
  ) {

    isStreaming =
      streaming;


    ui.sendBtn.disabled =
      streaming;


    ui.stopBtn.hidden =
      !streaming;

  }


  /* =========================================================
     SIDEBAR
  ========================================================= */

  function highlightActiveConversation() {

    document
      .querySelectorAll(
        ".conversation"
      )
      .forEach(
        (button) => {

          button.classList.toggle(
            "active",
            button.dataset.threadId
              === currentThreadId
          );

        }
      );

  }


  function closeMobileSidebar() {

    if (
      window.innerWidth <= 780
    ) {

      ui.sidebar.classList.remove(
        "mobile-open"
      );

    }

  }


  /* =========================================================
     NEW CHAT
  ========================================================= */

  function startNewChat() {

    if (
      activeController
    ) {

      activeController.abort();

    }


    setThreadId(
      generateThreadId()
    );


    ui.messages.innerHTML =
      "";


    ui.statusLine.textContent =
      "";


    ui.fileChip.style.display =
      "none";


    showEmptyState(
      true
    );


    highlightActiveConversation();


    closeMobileSidebar();


    ui.messageInput.focus();

  }


  /* =========================================================
     LOAD CONVERSATIONS
  ========================================================= */

  async function loadConversations() {

    try {

      const response =
        await fetch(
          "/conversations"
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "Unable to load conversations."
        );

      }


      const data =
        await response.json();


      ui.conversationList.innerHTML =
        "";


      for (
        const item
        of data.conversations || []
      ) {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "conversation";


        button.dataset.threadId =
          item.thread_id;


        const dot =
          document.createElement(
            "span"
          );


        dot.className =
          "conversation-dot";


        const title =
          document.createElement(
            "span"
          );


        title.className =
          "conversation-title";


        title.textContent =
          item.title
          || "New chat";


        button.appendChild(
          dot
        );


        button.appendChild(
          title
        );


        button.title =
          item.title
          || "New chat";


        button.addEventListener(
          "click",
          () => {

            loadHistory(
              item.thread_id
            );

          }
        );


        ui.conversationList.appendChild(
          button
        );

      }


      highlightActiveConversation();

    }
    catch (error) {

      console.error(
        error
      );


      showToast(
        error.message
      );

    }

  }


  /* =========================================================
     LOAD CHAT HISTORY
  ========================================================= */

  async function loadHistory(
    threadId
  ) {

    try {

      const response =
        await fetch(
          `/history/${encodeURIComponent(threadId)}`
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "Unable to load chat history."
        );

      }


      const data =
        await response.json();


      setThreadId(
        threadId
      );


      ui.messages.innerHTML =
        "";


      const messages =
        data.messages || [];


      showEmptyState(
        messages.length === 0
      );


      for (
        const message
        of messages
      ) {

        createMessage(

          message.role === "user"
            ? "user"
            : "assistant",

          message.content

        );

      }


      highlightActiveConversation();


      closeMobileSidebar();

    }
    catch (error) {

      console.error(
        error
      );


      showToast(
        error.message
      );

    }

  }


  /* =========================================================
     SEND CHAT MESSAGE
  ========================================================= */

  async function sendMessage() {

    const message =
      ui.messageInput.value.trim();


    if (
      !message
      || isStreaming
    ) {

      return;

    }


    createMessage(
      "user",
      message
    );


    ui.messageInput.value =
      "";


    resizeTextarea();


    const assistantBody =
      createStreamingAssistant();


    let assistantText =
      "";


    activeController =
      new AbortController();


    setStreamingState(
      true
    );


    ui.statusLine.textContent =
      "Thinking…";


    try {

      const response =
        await fetch(
          "/chat/stream",
          {

            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                {

                  message:
                    message,

                  thread_id:
                    currentThreadId,

                  model:
                    ui.modelSelect.value

                }
              ),

            signal:
              activeController.signal

          }
        );


      if (
        !response.ok
      ) {

        let detail =
          `Request failed (${response.status}).`;


        try {

          const payload =
            await response.json();


          detail =
            payload.error
            || payload.detail
            || detail;

        }
        catch (_) {}


        throw new Error(
          detail
        );

      }


      if (
        !response.body
      ) {

        throw new Error(
          "Streaming response is unavailable."
        );

      }


      const reader =
        response.body.getReader();


      const decoder =
        new TextDecoder();


      let buffer =
        "";


      while (
        true
      ) {

        const {
          value,
          done
        } =
          await reader.read();


        if (
          done
        ) {

          break;

        }


        buffer +=
          decoder.decode(
            value,
            {
              stream: true
            }
          );


        const events =
          buffer.split(
            "\n\n"
          );


        buffer =
          events.pop()
          || "";


        for (
          const block
          of events
        ) {

          const dataLine =
            block
              .split("\n")
              .find(
                (line) =>
                  line.startsWith(
                    "data:"
                  )
              );


          if (
            !dataLine
          ) {

            continue;

          }


          const raw =
            dataLine
              .slice(5)
              .trim();


          if (
            !raw
          ) {

            continue;

          }


          const event =
            JSON.parse(
              raw
            );


          if (
            event.error
          ) {

            throw new Error(
              event.error
            );

          }


          if (
            event.token
          ) {

            assistantText +=
              event.token;


            updateAssistant(
              assistantBody,
              assistantText
            );

          }


          if (
            event.done
          ) {

            ui.statusLine.textContent =
              "";

          }

        }

      }


      if (
        !assistantText.trim()
      ) {

        updateAssistant(
          assistantBody,
          "_The assistant returned an empty response._"
        );

      }


      await loadConversations();

    }
    catch (error) {

      if (
        error.name === "AbortError"
      ) {

        ui.statusLine.textContent =
          "Response stopped.";


        if (
          !assistantText.trim()
        ) {

          updateAssistant(
            assistantBody,
            "_Response stopped._"
          );

        }

      }
      else {

        console.error(
          error
        );


        showToast(
          error.message
          || "Something went wrong."
        );


        updateAssistant(

          assistantBody,

          assistantText
          || "_I couldn't complete that response._"

        );

      }

    }
    finally {

      activeController =
        null;


      setStreamingState(
        false
      );


      ui.messageInput.focus();

    }

  }


  /* =========================================================
     FILE UPLOAD
  ========================================================= */

  async function uploadFile(
    file
  ) {

    if (
      !file
    ) {

      return;

    }


    ui.fileChip.style.display =
      "inline-flex";


    ui.fileChipText.textContent =
      `Uploading ${file.name}…`;


    ui.statusLine.textContent =
      "Adding document to this conversation…";


    const formData =
      new FormData();


    formData.append(
      "file",
      file
    );


    formData.append(
      "thread_id",
      currentThreadId
    );


    try {

      const response =
        await fetch(
          "/upload",
          {

            method:
              "POST",

            body:
              formData

          }
        );


      const data =
        await response.json();


      if (
        !response.ok
        || !data.success
      ) {

        throw new Error(
          data.message
          || "Upload failed."
        );

      }


      ui.fileChipText.textContent =
        `✓ ${file.name}`;


      ui.statusLine.textContent =
        data.message
        || "Document added successfully.";


      await loadConversations();


      setTimeout(
        () => {

          ui.fileChip.style.display =
            "none";


          ui.statusLine.textContent =
            "";

        },
        3500
      );

    }
    catch (error) {

      console.error(
        error
      );


      ui.fileChip.style.display =
        "none";


      ui.statusLine.textContent =
        "";


      showToast(
        error.message
      );

    }
    finally {

      ui.fileInput.value =
        "";

    }

  }


  /* =========================================================
     TEXTAREA AUTO RESIZE
  ========================================================= */

  function resizeTextarea() {

    ui.messageInput.style.height =
      "auto";


    ui.messageInput.style.height =
      Math.min(
        ui.messageInput.scrollHeight,
        190
      )
      + "px";

  }


  /* =========================================================
     EVENT LISTENERS
  ========================================================= */

  ui.newChatBtn.addEventListener(
    "click",
    startNewChat
  );


  ui.topNewChatBtn.addEventListener(
    "click",
    startNewChat
  );


  ui.menuBtn.addEventListener(
    "click",
    () => {

      if (
        window.innerWidth <= 780
      ) {

        ui.sidebar.classList.toggle(
          "mobile-open"
        );

      }
      else {

        ui.sidebar.classList.toggle(
          "collapsed"
        );

      }

    }
  );


  ui.closeSidebarBtn.addEventListener(
    "click",
    () => {

      if (
        window.innerWidth <= 780
      ) {

        ui.sidebar.classList.remove(
          "mobile-open"
        );

      }
      else {

        ui.sidebar.classList.add(
          "collapsed"
        );

      }

    }
  );


  ui.sendBtn.addEventListener(
    "click",
    sendMessage
  );


  ui.stopBtn.addEventListener(
    "click",
    () => {

      activeController?.abort();

    }
  );


  ui.attachBtn.addEventListener(
    "click",
    () => {

      ui.fileInput.click();

    }
  );


  ui.fileInput.addEventListener(
    "change",
    () => {

      uploadFile(
        ui.fileInput.files?.[0]
      );

    }
  );


  ui.messageInput.addEventListener(
    "input",
    resizeTextarea
  );


  ui.messageInput.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter"
        && !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  document
    .querySelectorAll(
      ".prompt-card"
    )
    .forEach(
      (card) => {

        card.addEventListener(
          "click",
          () => {

            ui.messageInput.value =
              card.dataset.prompt
              || "";


            resizeTextarea();


            ui.messageInput.focus();

          }
        );

      }
    );


  /* =========================================================
     INITIALIZATION
  ========================================================= */

  async function initializeApp() {

    try {

      console.log(
        "RickyGPT frontend initialized"
      );


      console.log(
        "Secure context:",
        window.isSecureContext
      );


      console.log(
        "Thread ID:",
        currentThreadId
      );


      await loadConversations();


      ui.messageInput.focus();

    }
    catch (error) {

      console.error(
        "Frontend initialization error:",
        error
      );


      showToast(
        "The frontend could not initialize correctly."
      );

    }

  }


  initializeApp();

</script>

</body>
</html>
